<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1033">
  <title>Saufspiel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <main id="app">
    <!-- Menü: Spiel auswählen -->
    <section id="screen-menu" class="screen active">
      <header class="menu-head">
        <span class="menu-logo" aria-hidden="true">🍻</span>
        <h1>Saufspiel</h1>
        <p class="hint">Such dir ein Spiel aus</p>
      </header>
      <div id="game-list" class="game-list"></div>
      <p class="disclaimer">Trink verantwortungsvoll. Wasser zählt auch als Getränk.</p>
    </section>

    <!-- Ein Handy oder jeder sein Handy -->
    <section id="screen-mode" class="screen">
      <header class="game-bar">
        <button id="mode-back" class="btn ghost small" aria-label="Zurück">←</button>
        <span class="game-title"></span>
      </header>
      <p class="hint">Wie wollt ihr spielen?</p>
      <button id="mode-one" class="mode-tile">
        <span class="mode-emoji">📱</span>
        <span class="game-info">
          <span class="game-name">Ein Handy</span>
          <span class="game-desc">Alle spielen an diesem Handy, es geht reihum.</span>
        </span>
      </button>
      <button id="mode-multi" class="mode-tile">
        <span class="mode-emoji">📱📱</span>
        <span class="game-info">
          <span class="game-name">Jeder sein Handy</span>
          <span class="game-desc">Ein Handy macht einen Raum auf, alle anderen treten mit Code oder QR-Code bei.</span>
        </span>
      </button>
    </section>

    <!-- Spieler eintragen (ein Handy) -->
    <section id="screen-players" class="screen">
      <header class="game-bar">
        <button id="players-back" class="btn ghost small" aria-label="Zurück">←</button>
        <span class="game-title"></span>
      </header>
      <p class="hint">Wer spielt mit?</p>

      <form id="player-form" autocomplete="off">
        <input id="player-input" type="text" maxlength="20" placeholder="Name" aria-label="Spielername">
        <button type="submit" class="btn small">+</button>
      </form>
      <ul id="player-list" class="chips"></ul>

      <button id="start-btn" class="btn" disabled>Los geht’s</button>
    </section>

    <!-- Raum erstellen oder beitreten (jeder sein Handy) -->
    <section id="screen-room" class="screen">
      <header class="game-bar">
        <button id="room-back" class="btn ghost small" aria-label="Zurück">←</button>
        <span class="game-title"></span>
      </header>
      <label class="field">
        <span>Dein Name</span>
        <input id="room-name" type="text" maxlength="20" placeholder="Name" autocomplete="off">
      </label>
      <button id="room-create" class="btn">Raum erstellen</button>
      <p class="or">oder einem Raum beitreten</p>
      <div class="join-row">
        <input id="room-code" type="text" maxlength="4" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Raumcode">
        <button id="room-join" class="btn">Beitreten</button>
      </div>
      <p id="room-error" class="error" hidden></p>
      <button id="room-resume" class="btn ghost" hidden></button>
    </section>

    <!-- Warteraum (jeder sein Handy) -->
    <section id="screen-lobby" class="screen">
      <header class="game-bar">
        <button id="lobby-back" class="btn ghost small" aria-label="Raum verlassen">←</button>
        <span class="game-title"></span>
      </header>
      <p class="room-code">Raum <b id="lobby-code"></b></p>
      <div id="lobby-qr" class="qr"></div>
      <button id="lobby-share" class="btn ghost small share-btn">Link teilen</button>
      <ul id="lobby-players" class="chips"></ul>
      <p id="lobby-hint" class="hint"></p>
      <button id="lobby-start" class="btn" hidden>Los geht’s</button>
      <p class="conn"></p>
    </section>

    <!-- Das Spiel selbst -->
    <section id="screen-game" class="screen">
      <header class="game-bar">
        <button id="game-back" class="btn ghost small" aria-label="Zurück">←</button>
        <span class="game-title"></span>
      </header>
      <p class="conn"></p>
      <div id="game-root" class="game-root"></div>
    </section>
  </main>

  <!-- Trink-Meldung -->
  <div id="drink-alert" class="drink-alert" hidden>
    <div class="da-box" role="alertdialog" aria-labelledby="da-title">
      <div id="da-emoji" class="da-emoji"></div>
      <h2 id="da-title"></h2>
      <ul id="da-list"></ul>
      <button id="da-ok" class="btn">Prost! 🍻</button>
    </div>
  </div>

  <script src="vendor/mqtt.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="games.js"></script>
  <script src="cards.js"></script>
  <script src="busfahrer.js"></script>
  <script src="triade.js"></script>
  <script src="dealer.js"></script>
  <script src="flunky.js"></script>
  <script src="room.js"></script>
  <script src="app.js"></script>
</body>
</html>
