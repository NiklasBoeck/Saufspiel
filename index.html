<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1033">
  <title>Saufspiel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Menü: Spiel auswählen -->
    <section id="screen-menu" class="screen active">
      <header class="menu-head">
        <h1>🍻 Saufspiel</h1>
        <p class="hint">Such dir ein Spiel aus.</p>
      </header>
      <div id="game-list" class="game-list"></div>
      <p class="disclaimer">Trink verantwortungsvoll. Wasser zählt auch als Getränk.</p>
    </section>

    <!-- Spieler eintragen -->
    <section id="screen-players" class="screen">
      <header class="game-bar">
        <button class="btn ghost small back-btn" aria-label="Zurück">←</button>
        <span id="players-title"></span>
      </header>
      <p class="hint">Wer spielt mit?</p>

      <form id="player-form" autocomplete="off">
        <input id="player-input" type="text" maxlength="20" placeholder="Name" aria-label="Spielername">
        <button type="submit" class="btn small">+</button>
      </form>
      <ul id="player-list"></ul>

      <button id="start-btn" class="btn" disabled>Los geht’s</button>
    </section>

    <!-- Kartenspiele -->
    <section id="screen-game" class="screen">
      <header class="game-bar">
        <button class="btn ghost small back-btn" aria-label="Zurück">←</button>
        <span id="round-label"></span>
      </header>

      <article id="card" class="card">
        <span id="card-category" class="card-category"></span>
        <p id="card-text" class="card-text"></p>
      </article>

      <button id="next-btn" class="btn">Nächste Karte</button>
    </section>

    <!-- Spiele mit eigener Oberfläche (z. B. Busfahrer) -->
    <section id="screen-custom" class="screen">
      <header class="game-bar">
        <button class="btn ghost small back-btn" aria-label="Zurück">←</button>
        <span id="custom-title"></span>
      </header>
      <div id="custom-root" class="custom-root"></div>
    </section>
  </main>

  <script src="games.js"></script>
  <script src="cards.js"></script>
  <script src="busfahrer.js"></script>
  <script src="triade.js"></script>
  <script src="flunky.js"></script>
  <script src="app.js"></script>
</body>
</html>
